[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidmaxx"
version = "0.1.0"
description = "Local YouTube automation pipeline — research to rendered video on M2"
requires-python = ">=3.9"
dependencies = [
    # Core async / HTTP
    "httpx[http2]>=0.27",
    "anyio>=4.0",
    "tenacity>=8.2",

    # Data / config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # LLM + research
    "litellm>=1.40",
    "tavily-python>=0.3",

    # TTS
    "chatterbox-tts",

    # Vision / alignment
    "open-clip-torch>=2.24",
    "whisperx",

    # ML runtime (MPS)
    "torch>=2.2",
    "torchaudio>=2.2",

    # Audio processing
    "soundfile>=0.12",
    "numpy>=1.26",

    # State / caching
    "diskcache>=5.6",

    # CLI + logging
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.scripts]
vidmaxx = "vidmaxx.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["vidmaxx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
